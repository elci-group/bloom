[package]
name = "bloom_backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bloom_backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"