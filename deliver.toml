[[file]]
path = "platform/linux/bloomd.service"
required = true

[[file]]
path = "README.md"
required = true
require_line_count = 20

[[file]]
path = "docs/architecture.md"
required = true

[[file]]
path = "docs/roadmap.md"
required = true

[[file]]
path = "LICENSE"
required = true

[[command]]
name = "workspace tests"
cmd = ["cargo", "test", "--workspace"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "clippy"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "format check"
cmd = ["cargo", "fmt", "--check"]
expect_exit = 0
timeout_secs = 60
